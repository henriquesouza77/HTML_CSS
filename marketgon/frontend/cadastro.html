<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadastre-se - Market Gon</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="pagina-formulario">
  <div class="formulario-marca">
    <img src="assets/marketgon.svg" alt="Market Gon">
    <h2>MARKET GON</h2>
    <p>Sua Mercearia Online</p>
    <p><em>"Cadastre-se e receba ofertas imbatíveis do MARKET GON"</em></p>
  </div>
  <div class="formulario-lateral">
    <div class="cartao-form">
      <h2>Cadastre-se no <strong>MARKET GON</strong></h2>
      <p class="aviso-obrigatorio">Os campos marcados com (*) são obrigatórios</p>
      <form id="form-cadastro">
        <div class="campo">
          <label for="cpf">CPF*</label>
          <input type="text" id="cpf" required>
        </div>
        <div class="campo">
          <label for="nome">Nome completo*</label>
          <input type="text" id="nome" required>
        </div>
        <div class="campo">
          <label for="email">Email*</label>
          <input type="email" id="email" required>
        </div>
        <div class="campo">
          <label for="data_nascimento">Data de nascimento*</label>
          <input type="date" id="data_nascimento" required>
        </div>
        <div class="campo">
          <label for="senha">Senha*</label>
          <input type="password" id="senha" required>
        </div>
        <button type="submit" class="btn-primario">Avançar</button>
        <p id="mensagem-erro" class="mensagem-erro"></p>
      </form>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/cadastro.js"></script>
</body>
</html>
